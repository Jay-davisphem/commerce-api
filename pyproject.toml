[project]
name = "commerce-api"
version = "0.1.0"
description = "Headless eCommerce API (FastAPI + Postgres + Paystack)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    # Hashing for HMAC Paystack webhook signature verification
    "cryptography>=42.0",
    # Auth: JWT tokens + bcrypt password hashing
    "PyJWT>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
commerce-api = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
